
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P7 - Design System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Design System</h1>
        <p>A simple guide to my website styles.</p>
    </header>

    <main>
        <section>
            <h2>Color Palette</h2>
            <div class="colors">
                <div class="color-box primary">Primary</div>
                <div class="color-box secondary">Secondary</div>
                <div class="color-box accent">Accent</div>
            </div>
        </section>

        <section>
            <h2>Typography</h2>
            <h1>Heading One</h1>
            <h2>Heading Two</h2>
            <h3>Heading Three</h3>
            <p>This is a paragraph showing the typography system.</p>
            <small>This is small text.</small>
        </section>

        <section>
            <h2>Spacing System</h2>
            <div class="spacing-box">Small Spacing</div>
            <div class="spacing-box large">Large Spacing</div>
        </section>
    </main>

    <footer>
        <p>Created for P7 Assignment</p>
    </footer>

</body>
</html>
